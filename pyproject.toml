[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-market-lab"
version = "1.0.0"
description = "Auditable day-ahead US electricity price forecasting with machine learning and deep learning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Behnam Mohseni Gharyehsafa"}]
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2", "torch>=2.6,<3", "xgboost>=3,<4",
  "matplotlib>=3.9,<4", "pyarrow>=18", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
foundation = ["chronos-forecasting>=2.2,<3"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
electricity-lab = "electricity_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/write_readme.py" = ["E501"]  # Markdown tables and image alt text in the document template
